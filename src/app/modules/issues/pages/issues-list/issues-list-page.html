<h1>GitHub Issues</h1>
<dir class="my-5 border-b-2 bg-blue-600"></dir>

<section class="grid grid-cols-1 lg:grid-cols-3 gap-2">
  <div class="col-span-3 flex flex-col">
    <div class="flex gap-2">
      <button
        [class.active]="issuesSvc.selectedState() === 'all'"
        class="btn"
        (click)="onChangeState('all')"
      >
        All
      </button>
      <button
        [class.active]="issuesSvc.selectedState() === 'open'"
        class="btn"
        (click)="onChangeState('open')"
      >
        Open
      </button>
      <button
        [class.active]="issuesSvc.selectedState() === 'closed'"
        class="btn"
        (click)="onChangeState('closed')"
      >
        Closed
      </button>
    </div>
  </div>

  <div class="mt-4 flex flex-col lg:col-span-2 col-span-3">
    @for (issue of issuesQuery.data(); track issue.id) {
      <issue-item [issue]="issue" />
    } @empty {
      @if (issuesQuery.isLoading()) {
        <p>Cargando issues</p>
      } @else {
        <p>No hay issues que mostrar</p>
      }
    }
  </div>

  <div class="flex flex-col lg:col-span-1 col-span-3">
    @if (labelsQuery.isLoading()) {
      <p>Estamos cargando</p>
    } @else {
      <issues-labels-selector [labels]="labelsQuery.data() ?? []" />
    }
  </div>
</section>
